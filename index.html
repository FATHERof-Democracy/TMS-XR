
<script>
const steps = [
  {
    title: "STEP 1 OF 4 · PREPARATION",
    text: "Move the antiseptic swab from the tray onto the correct forearm area.",
    hint: "Drag the white swab onto the upper surface of the forearm.",
    target: "swab",
    points: 20
  },
  {
    title: "STEP 2 OF 4 · SITE PREPARATION",
    text: "Select the tourniquet to continue the sequence.",
    hint: "Aim at the blue band on the arm.",
    target: "tourniquet",
    points: 20
  },
  {
    title: "STEP 3 OF 4 · IDENTIFICATION",
    text: "Identify the visible superficial vein.",
    hint: "Aim at the blue vein on the forearm.",
    target: "vein",
    points: 20
  },
  {
    title: "STEP 4 OF 4 · CANNULA",
    text: "Select the cannula to complete this simulation.",
    hint: "Aim at the cannula near the wrist.",
    target: "cannula",
    points: 40
  }
];

let currentStep = 0;
let score = 0;
let mistakes = 0;
let running = false;
let completed = new Set();
let penaltyLocked = new Set();
let interactionLocked = false;
let feedbackTimer = null;

const scoreEl = document.getElementById("score");
const progressEl = document.getElementById("progress");
const stepTitleEl = document.getElementById("stepTitle");
const stepTextEl = document.getElementById("stepText");
const hintEl = document.getElementById("hint");
const screen = document.getElementById("screen");
const welcomePanel = document.getElementById("welcomePanel");
const resultPanel = document.getElementById("resultPanel");

const sceneEl = document.querySelector("a-scene");
const swabEl = document.getElementById("swab");
const swabGroup = document.getElementById("swabGroup");

const swabStart = new THREE.Vector3(1.15, 1.025, -1.52);
const cleaningTarget = new THREE.Vector3(-0.28, 1.38, -1.33);

let draggingSwab = false;
let dragPlane = null;
let pointerId = null;
let originalSwabPosition = null;

function updateScore() {
  scoreEl.textContent = score;
  progressEl.style.width =
    (currentStep / steps.length * 100) + "%";
}

function showStep() {
  if (currentStep >= steps.length) {
    finishSimulation();
    return;
  }

  const step = steps[currentStep];
  stepTitleEl.textContent = step.title;
  stepTextEl.textContent = step.text;
  hintEl.textContent = step.hint;
  updateScore();
}

function wrongAction(message) {
  if (!running || interactionLocked) return;

  interactionLocked = true;
  mistakes++;
  score = Math.max(0, score - 5);
  updateScore();

  stepTitleEl.textContent = "TRY AGAIN · −5 POINTS";
  stepTextEl.textContent = message;
  hintEl.textContent = "Review the instruction and try again.";

  clearTimeout(feedbackTimer);
  feedbackTimer = setTimeout(() => {
    interactionLocked = false;
    if (running) showStep();
  }, 1200);
}

function handleSelection(id) {
  if (!running || interactionLocked ||
      currentStep >= steps.length) return;

  const step = steps[currentStep];

  if (id !== step.target) {
    if (penaltyLocked.has(id)) return;
    penaltyLocked.add(id);
    wrongAction("That is not the expected object for this step.");
    return;
  }

  if (completed.has(id)) return;

  interactionLocked = true;
  completed.add(id);
  score = Math.min(100, score + step.points);
  currentStep++;

  updateScore();

  const target = document.getElementById(id);
  if (target) {
    target.setAttribute("material", "emissive", "#38e6ba");
    target.setAttribute("material", "emissiveIntensity", 0.35);
  }

  clearTimeout(feedbackTimer);
  feedbackTimer = setTimeout(() => {
    interactionLocked = false;
    if (currentStep < steps.length) {
      showStep();
    } else {
      finishSimulation();
    }
  }, 700);
}

/* SWAB DRAGGING */

function getPointerCoordinates(event) {
  const canvas = sceneEl.canvas;
  const rect = canvas.getBoundingClientRect();

  return {
    x: ((event.clientX - rect.left) / rect.width) * 2 - 1,
    y: -((event.clientY - rect.top) / rect.height) * 2 + 1
  };
}

function getCamera() {
  return document.getElementById("mainCamera")
    .getObject3D("camera");
}

function pointerHitsSwab(event) {
  if (!sceneEl.canvas || !swabEl.object3D) return false;

  const pointer = getPointerCoordinates(event);
  const raycaster = new THREE.Raycaster();

  raycaster.setFromCamera(pointer, getCamera());

  const hits = raycaster.intersectObject(
    swabEl.object3D,
    true
  );

  return hits.length > 0;
}

function moveSwabWithPointer(event) {
  if (!draggingSwab) return;

  const pointer = getPointerCoordinates(event);
  const raycaster = new THREE.Raycaster();

  raycaster.setFromCamera(pointer, getCamera());

  const intersections = new THREE.Vector3();
  const found = raycaster.ray.intersectPlane(
    dragPlane,
    intersections
  );

  if (!found) return;

  const groupPosition = swabGroup.object3D.position;
  groupPosition.set(
    intersections.x,
    intersections.y,
    intersections.z
  );

  swabGroup.object3D.rotation.set(0, 0, 0);
}

function startSwabDrag(event) {
  if (!running || interactionLocked ||
      currentStep !== 0 || completed.has("swab")) return;

  if (!pointerHitsSwab(event)) return;

  event.preventDefault();

  draggingSwab = true;
  pointerId = event.pointerId;

  originalSwabPosition =
    swabGroup.object3D.position.clone();

  dragPlane = new THREE.Plane(
    new THREE.Vector3(0, 0, 1),
    1.33
  );

  if (sceneEl.canvas.setPointerCapture) {
    try {
      sceneEl.canvas.setPointerCapture(pointerId);
    } catch (_) {}
  }

  moveSwabWithPointer(event);

  stepTitleEl.textContent = "SWAB IN HAND";
  stepTextEl.textContent =
    "Move the swab onto the correct area of the forearm.";
  hintEl.textContent = "Release when the swab is over the target.";
}

function finishSwabDrag(event) {
  if (!draggingSwab) return;

  moveSwabWithPointer(event);
  draggingSwab = false;

  const currentPosition =
    swabGroup.object3D.position.clone();

  const distance = currentPosition.distanceTo(cleaningTarget);

  if (distance < 0.58) {
    swabGroup.object3D.position.set(
      cleaningTarget.x,
      cleaningTarget.y,
      cleaningTarget.z
    );

    handleSelection("swab");

    stepTitleEl.textContent = "SITE PREPARATION COMPLETE";
    stepTextEl.textContent =
      "Correct placement. Continue to the next stage.";
    hintEl.textContent =
      "This prototype checks placement; it does not yet simulate wiping or validate antiseptic technique.";
  } else {
    if (originalSwabPosition) {
      swabGroup.object3D.position.copy(originalSwabPosition);
      swabGroup.object3D.rotation.set(0, 0, -12);
    }

    wrongAction(
      "The swab was not placed over the designated forearm area."
    );
  }

  pointerId = null;
}

function installSwabDragging() {
  const canvas = sceneEl.canvas;
  if (!canvas || canvas.dataset.swabDragReady) return;

  canvas.dataset.swabDragReady = "true";
  canvas.style.touchAction = "none";

  canvas.addEventListener("pointerdown", startSwabDrag);
  canvas.addEventListener("pointermove", event => {
    if (draggingSwab) {
      event.preventDefault();
      moveSwabWithPointer(event);
    }
  });

  canvas.addEventListener("pointerup", finishSwabDrag);
  canvas.addEventListener("pointercancel", event => {
    if (!draggingSwab) return;

    draggingSwab = false;

    if (originalSwabPosition) {
      swabGroup.object3D.position.copy(originalSwabPosition);
      swabGroup.object3D.rotation.set(0, 0, -12);
    }

    pointerId = null;
  });
}

/* OTHER OBJECTS KEEP THEIR SELECTION INTERACTIONS */

function installInteractions() {
  document.querySelectorAll(".clickable").forEach(el => {
    if (el.id === "swab" ||
        el.dataset.interactionInstalled) return;

    el.dataset.interactionInstalled = "true";

    el.addEventListener("click", () => {
      if (el.id === "tourniquet" ||
          el.id === "vein" ||
          el.id === "cannula") {
        handleSelection(el.id);
      }
    });

    el.addEventListener("mouseleave", () => {
      penaltyLocked.delete(el.id);
    });
  });

  installSwabDragging();
}

function finishSimulation() {
  running = false;
  interactionLocked = false;
  progressEl.style.width = "100%";

  screen.style.display = "flex";
  welcomePanel.style.display = "none";
  resultPanel.style.display = "block";
  document.getElementById("results").style.display = "block";

  document.getElementById("finalScore").textContent =
    score + "/100";
  document.getElementById("finalStages").textContent =
    completed.size + "/4";
  document.getElementById("finalMistakes").textContent =
    mistakes;

  let message =
    "Sequence completed. Review your score and try again.";

  if (score >= 90) {
    message = "Excellent object selection. Continue practising under supervision.";
  } else if (score >= 70) {
    message = "Good effort. Review your mistakes and repeat the sequence.";
  } else {
    message = "Keep practising the sequence and review the equipment.";
  }

  document.getElementById("resultMessage").textContent = message;
  stepTitleEl.textContent = "SIMULATION COMPLETE";
  stepTextEl.textContent = "You completed all four stages.";
  hintEl.textContent = "Select Practise Again to repeat.";
}

function startSimulation() {
  clearTimeout(feedbackTimer);

  currentStep = 0;
  score = 0;
  mistakes = 0;
  completed = new Set();
  penaltyLocked = new Set();
  interactionLocked = false;
  draggingSwab = false;
  running = true;

  swabGroup.object3D.position.copy(swabStart);
  swabGroup.object3D.rotation.set(0, 0, -12);

  document.querySelectorAll(".clickable").forEach(el => {
    el.setAttribute("material", "emissive", "#000000");
    el.setAttribute("material", "emissiveIntensity", 0);
  });

  screen.style.display = "none";
  welcomePanel.style.display = "block";
  resultPanel.style.display = "none";
  document.getElementById("results").style.display = "none";

  updateScore();
  showStep();
}

document.getElementById("startBtn")
  .addEventListener("click", startSimulation);

document.getElementById("restartBtn")
  .addEventListener("click", startSimulation);

if (sceneEl.hasLoaded) {
  installInteractions();
} else {
  sceneEl.addEventListener("loaded", installInteractions);
}

showStep();
</script>
