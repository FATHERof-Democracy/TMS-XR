<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TMS-XR IV Cannulation Simulator</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene background="color: #dcecf2">

  <!-- LIGHTING -->
  <a-entity light="type: ambient; intensity: 1.2"></a-entity>

  <a-entity
    light="type: directional; intensity: 1.5"
    position="-2 4 3">
  </a-entity>

  <!-- FLOOR -->
  <a-plane
    position="0 0 -2"
    rotation="-90 0 0"
    width="8"
    height="8"
    color="#eef3f5">
  </a-plane>


  <!-- ================= CAMERA ================= -->

  <a-entity camera
            position="0 1.62 0"
            rotation="-3 0 0">

    <!-- INSTRUCTIONS -->
    <a-text
      value="TMS-XR | IV CANNULATION"
      position="0 0.35 -1.5"
      align="center"
      width="2.8"
      color="#003b5c">
    </a-text>

    <a-text
      id="instruction"
      value="STEP 1 | CLEAN THE INSERTION SITE"
      position="0 0.08 -1.5"
      align="center"
      width="2.4"
      color="#111111">
    </a-text>

    <!-- SCORE -->
    <a-text
      id="score"
      value="SCORE: 0 / 100"
      position="0 -0.18 -1.5"
      align="center"
      width="1.8"
      color="#006633">
    </a-text>

    <!-- GAZE CURSOR -->
    <a-cursor
      fuse="true"
      fuse-timeout="1500"
      color="#ff2222"
      geometry="primitive:ring; radiusInner:0.012; radiusOuter:0.028"
      raycaster="objects: .clickable">
    </a-cursor>

  </a-entity>


  <!-- ================= PROCEDURE AREA ================= -->

  <!-- TRAY -->
  <a-box
    position="0 0.72 -2"
    width="3.2"
    height="0.12"
    depth="1.8"
    color="#c7d0d5">
  </a-box>

  <a-box
    position="0 0.79 -2"
    width="3"
    height="0.05"
    depth="1.6"
    color="#f7f7f7">
  </a-box>


  <!-- ================= ARM ================= -->

  <a-cylinder
    position="0 1.05 -2"
    radius="0.42"
    height="2.2"
    rotation="0 0 90"
    color="#d69b72">
  </a-cylinder>

  <!-- ELBOW -->
  <a-sphere
    position="0.55 1.05 -2"
    radius="0.43"
    color="#d69b72">
  </a-sphere>


  <!-- HAND -->
  <a-box
    position="1.05 1.05 -2"
    width="0.75"
    height="0.5"
    depth="0.75"
    color="#d69b72">
  </a-box>

  <!-- FINGERS -->
  <a-box
    position="1.42 1.18 -2"
    width="0.42"
    height="0.13"
    depth="0.13"
    color="#d69b72">
  </a-box>

  <a-box
    position="1.42 1.05 -2"
    width="0.42"
    height="0.13"
    depth="0.13"
    color="#d69b72">
  </a-box>

  <a-box
    position="1.42 0.92 -2"
    width="0.42"
    height="0.13"
    depth="0.13"
    color="#d69b72">
  </a-box>


  <!-- ================= TOURNIQUET ================= -->

  <a-torus
    id="tourniquet"
    class="clickable"
    position="0.05 1.28 -1.86"
    radius="0.43"
    radius-tubular="0.045"
    rotation="90 0 0"
    color="#1464d2"
    visible="false">
  </a-torus>


  <!-- ================= VEIN ================= -->

  <a-cylinder
    id="vein"
    class="clickable"
    position="0.05 1.28 -1.55"
    radius="0.035"
    height="0.5"
    rotation="90 0 0"
    color="#246bce"
    visible="false">
  </a-cylinder>


  <!-- ================= SWAB ================= -->

  <!-- LARGE CLICK TARGET -->
  <a-box
    id="swabTarget"
    class="clickable"
    position="0 1.38 -1.65"
    width="0.85"
    height="0.55"
    depth="0.35"
    material="color:#00ff66; opacity:0.08; transparent:true">
  </a-box>

  <!-- VISIBLE SWAB -->
  <a-box
    id="swab"
    position="0 1.38 -1.65"
    width="0.32"
    height="0.12"
    depth="0.20"
    rotation="0 0 -15"
    color="#00dd55">
  </a-box>

  <!-- SWAB HANDLE -->
  <a-cylinder
    position="0 1.51 -1.65"
    radius="0.025"
    height="0.28"
    rotation="0 0 -15"
    color="#ffffff">
  </a-cylinder>


  <!-- ================= CANNULA ================= -->

  <a-cylinder
    id="catheter"
    class="clickable"
    position="0.05 1.30 -1.72"
    radius="0.045"
    height="0.42"
    rotation="78 0 0"
    color="#ffd000"
    visible="false">
  </a-cylinder>

  <!-- CANNULA HUB -->
  <a-cylinder
    id="hub"
    position="0.05 1.13 -1.58"
    radius="0.09"
    height="0.16"
    rotation="78 0 0"
    color="#ffffff"
    visible="false">
  </a-cylinder>


  <!-- ================= NEEDLE ================= -->

  <a-cylinder
    id="needle"
    position="0.05 1.30 -1.91"
    radius="0.012"
    height="0.55"
    rotation="78 0 0"
    color="#c5cdd1"
    visible="false">
  </a-cylinder>


  <!-- NEEDLE TIP -->
  <a-sphere
    id="needleTip"
    position="0.05 1.30 -2.17"
    radius="0.018"
    color="#eeeeee"
    visible="false">
  </a-sphere>


  <!-- ================= SYRINGE ================= -->

  <a-cylinder
    id="syringe"
    position="1.15 1.65 -1.8"
    radius="0.08"
    height="0.55"
    rotation="0 0 90"
    color="#ffffff"
    visible="false">
  </a-cylinder>

  <a-cylinder
    id="syringeTip"
    position="0.87 1.65 -1.8"
    radius="0.025"
    height="0.15"
    rotation="0 0 90"
    color="#cccccc"
    visible="false">
  </a-cylinder>


  <!-- ================= FLASHBACK ================= -->

  <a-sphere
    id="flashback"
    position="0.05 1.30 -2.12"
    radius="0.055"
    color="#cc0000"
    visible="false">
  </a-sphere>


  <!-- ================= BLOOD COLLECTION ================= -->

  <a-cylinder
    id="bloodTube"
    position="1.15 0.98 -1.9"
    radius="0.12"
    height="0.55"
    color="#eeeeee"
    visible="false">
  </a-cylinder>

  <a-cylinder
    id="blood"
    position="1.15 0.80 -1.9"
    radius="0.095"
    height="0.20"
    color="#b30000"
    visible="false">
  </a-cylinder>

  <a-cylinder
    id="tubeCap"
    position="1.15 1.27 -1.9"
    radius="0.13"
    height="0.08"
    color="#444444"
    visible="false">
  </a-cylinder>


  <!-- ================= SUCCESS ================= -->

  <a-text
    id="success"
    value="✓ PROCEDURE COMPLETED"
    position="0 1.95 -1.7"
    align="center"
    width="3"
    color="#008844"
    visible="false">
  </a-text>

  <a-text
    id="finalScore"
    value="FINAL SCORE: 100 / 100"
    position="0 1.72 -1.7"
    align="center"
    width="2.5"
    color="#003b5c"
    visible="false">
  </a-text>


  <!-- ================= LOGIC ================= -->

  <script>

    let step = 1;
    let score = 0;

    const instruction = document.querySelector("#instruction");
    const scoreText = document.querySelector("#score");

    const swabTarget = document.querySelector("#swabTarget");
    const swab = document.querySelector("#swab");

    const tourniquet = document.querySelector("#tourniquet");
    const vein = document.querySelector("#vein");

    const catheter = document.querySelector("#catheter");
    const hub = document.querySelector("#hub");
    const needle = document.querySelector("#needle");
    const needleTip = document.querySelector("#needleTip");

    const flashback = document.querySelector("#flashback");

    const bloodTube = document.querySelector("#bloodTube");
    const blood = document.querySelector("#blood");
    const tubeCap = document.querySelector("#tubeCap");

    const success = document.querySelector("#success");
    const finalScore = document.querySelector("#finalScore");


    function updateScore(points) {

      score += points;

      scoreText.setAttribute(
        "value",
        "SCORE: " + score + " / 100"
      );
    }


    /* ================= STEP 1 ================= */

    swabTarget.addEventListener("click", function () {

      if (step !== 1) return;

      step = 2;

      updateScore(20);

      swab.setAttribute("color", "#999999");

      swabTarget.setAttribute(
        "material",
        "color:#999999; opacity:0.08; transparent:true"
      );

      instruction.setAttribute(
        "value",
        "STEP 2 | APPLY THE BLUE TOURNIQUET"
      );

      tourniquet.setAttribute("visible", true);

    });


    /* ================= STEP 2 ================= */

    tourniquet.addEventListener("click", function () {

      if (step !== 2) return;

      step = 3;

      updateScore(20);

      instruction.setAttribute(
        "value",
        "STEP 3 | IDENTIFY THE HIGHLIGHTED VEIN"
      );

      vein.setAttribute("visible", true);

    });


    /* ================= STEP 3 ================= */

    vein.addEventListener("click", function () {

      if (step !== 3) return;

      step = 4;

      updateScore(20);

      instruction.setAttribute(
        "value",
        "STEP 4 | INSERT THE CANNULA"
      );

      catheter.setAttribute("visible", true);
      hub.setAttribute("visible", true);
      needle.setAttribute("visible", true);
      needleTip.setAttribute("visible", true);

    });


    /* ================= STEP 4 ================= */

    catheter.addEventListener("click", function () {

      if (step !== 4) return;

      step = 5;

      updateScore(40);

      instruction.setAttribute(
        "value",
        "✓ CANNULA INSERTED | OBSERVE FLASHBACK"
      );

      flashback.setAttribute("visible", true);

      setTimeout(function () {

        flashback.setAttribute("visible", false);

        instruction.setAttribute(
          "value",
          "BLOOD SAMPLE COLLECTION"
        );

        bloodTube.setAttribute("visible", true);
        tubeCap.setAttribute("visible", true);
        blood.setAttribute("visible", true);

      }, 1500);


      setTimeout(function () {

        success.setAttribute("visible", true);
        finalScore.setAttribute("visible", true);

        instruction.setAttribute(
          "value",
          "PROCEDURE COMPLETE"
        );

      }, 3000);

    });

  </script>

</a-scene>

</body>
</html>
