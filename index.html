<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IV Cannulation Simulator</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <script>
    let currentStep = 1;
    let score = 0;

    AFRAME.registerComponent('cannulation-logic', {

      init: function () {

        const scene = this.el;

        const setup = () => {

          const instructions = document.querySelector('#step-text');
          const scoreText = document.querySelector('#score-text');

          const swab = document.querySelector('#swab');
          const tourniquet = document.querySelector('#tourniquet');
          const vein = document.querySelector('#vein');
          const catheter = document.querySelector('#catheter');

          // STEP 1
          swab.addEventListener('click', () => {

            if (currentStep !== 1) return;

            currentStep = 2;
            score += 20;

            instructions.setAttribute(
              'value',
              'STEP 2: Look at the BLUE tourniquet.'
            );

            swab.setAttribute('color', '#777777');

            scoreText.setAttribute(
              'value',
              'SCORE: ' + score
            );
          });


          // STEP 2
          tourniquet.addEventListener('click', () => {

            if (currentStep !== 2) return;

            currentStep = 3;
            score += 20;

            instructions.setAttribute(
              'value',
              'STEP 3: Look at the highlighted VEIN.'
            );

            vein.setAttribute('visible', 'true');

            tourniquet.setAttribute('color', '#777777');

            scoreText.setAttribute(
              'value',
              'SCORE: ' + score
            );
          });


          // STEP 3
          vein.addEventListener('click', () => {

            if (currentStep !== 3) return;

            currentStep = 4;
            score += 20;

            instructions.setAttribute(
              'value',
              'STEP 4: Look at the YELLOW CANNULA to insert it.'
            );

            vein.setAttribute('color', '#00ff00');

            catheter.setAttribute('visible', 'true');

            scoreText.setAttribute(
              'value',
              'SCORE: ' + score
            );
          });


          // STEP 4
          catheter.addEventListener('click', () => {

            if (currentStep !== 4) return;

            currentStep = 5;
            score += 40;

            instructions.setAttribute(
              'value',
              'SUCCESS! Cannulation completed. 🎉'
            );

            catheter.setAttribute('color', '#00ff00');

            scoreText.setAttribute(
              'value',
              'FINAL SCORE: ' + score + '/100'
            );
          });

        };

        if (scene.hasLoaded) {
          setup();
        } else {
          scene.addEventListener('loaded', setup);
        }

      }

    });
  </script>
</head>


<body>

<a-scene cannulation-logic>

  <!-- BACKGROUND -->
  <a-sky color="#dfeff5"></a-sky>


  <!-- TITLE -->
  <a-text
    value="IV CANNULATION SIMULATOR"
    position="-1.8 2.6 -3"
    width="4"
    color="#111111">
  </a-text>


  <!-- INSTRUCTIONS -->
  <a-text
    id="step-text"
    value="STEP 1: Look at the GREEN swab."
    position="-1.8 2.2 -3"
    width="4"
    color="#111111">
  </a-text>


  <!-- SCORE -->
  <a-text
    id="score-text"
    value="SCORE: 0"
    position="1.2 2.6 -3"
    width="2"
    color="#111111">
  </a-text>


  <!-- TABLE -->
  <a-box
    position="0 0.8 -2"
    width="2.5"
    height="0.15"
    depth="1.5"
    color="#ffffff">
  </a-box>


  <!-- ARM -->
  <a-cylinder
    position="0 1.0 -2"
    radius="0.18"
    height="1.5"
    rotation="0 0 90"
    color="#d99b7c">
  </a-cylinder>


  <!-- GREEN SWAB -->
  <a-box
    id="swab"
    class="clickable"
    position="0.8 0.95 -1.5"
    width="0.2"
    height="0.05"
    depth="0.2"
    color="#00ff00">
  </a-box>


  <!-- BLUE TOURNIQUET -->
  <a-torus
    id="tourniquet"
    class="clickable"
    position="-0.3 1.0 -2"
    radius="0.20"
    radius-tubular="0.025"
    rotation="0 90 0"
    color="#0066ff">
  </a-torus>


  <!-- VEIN -->
  <a-cylinder
    id="vein"
    class="clickable"
    position="0.15 1.18 -1.83"
    radius="0.04"
    height="0.45"
    rotation="0 0 90"
    color="#4ba3e3"
    visible="false">
  </a-cylinder>


  <!-- YELLOW CANNULA -->
  <a-cone
    id="catheter"
    class="clickable"
    position="0.15 1.18 -1.55"
    radius-bottom="0.05"
    height="0.35"
    rotation="90 0 0"
    color="#ffcc00"
    visible="false">
  </a-cone>


  <!-- CAMERA -->
  <a-camera position="0 1.6 0">

    <a-cursor
      fuse="true"
      fuse-timeout="1500"
      color="red"
      raycaster="objects: .clickable">
    </a-cursor>

  </a-camera>

</a-scene>

</body>
</html>
