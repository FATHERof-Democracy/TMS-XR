<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TMS-XR | IV Cannulation Simulator</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <script>
    let currentStep = 1;
    let score = 0;

    AFRAME.registerComponent('cannulation-logic', {

      init: function () {

        const setup = () => {

          const instructions = document.querySelector('#step-text');
          const scoreText = document.querySelector('#score-text');

          const swab = document.querySelector('#swab');
          const tourniquet = document.querySelector('#tourniquet');
          const vein = document.querySelector('#vein');
          const catheter = document.querySelector('#catheter');
          const needle = document.querySelector('#needle');

          const bloodTube = document.querySelector('#blood-tube');
          const blood = document.querySelector('#blood');

          const success = document.querySelector('#success');

          /* STEP 1 */

          swab.addEventListener('click', () => {

            if (currentStep !== 1) return;

            currentStep = 2;
            score += 20;

            instructions.setAttribute(
              'value',
              'STEP 2 | APPLY THE BLUE TOURNIQUET'
            );

            scoreText.setAttribute(
              'value',
              'SCORE: ' + score
            );

            swab.setAttribute('color', '#777777');
          });


          /* STEP 2 */

          tourniquet.addEventListener('click', () => {

            if (currentStep !== 2) return;

            currentStep = 3;
            score += 20;

            instructions.setAttribute(
              'value',
              'STEP 3 | IDENTIFY THE HIGHLIGHTED VEIN'
            );

            vein.setAttribute('visible', 'true');

            tourniquet.setAttribute(
              'color',
              '#777777'
            );

            scoreText.setAttribute(
              'value',
              'SCORE: ' + score
            );
          });


          /* STEP 3 */

          vein.addEventListener('click', () => {

            if (currentStep !== 3) return;

            currentStep = 4;
            score += 20;

            instructions.setAttribute(
              'value',
              'STEP 4 | INSERT THE CANNULA'
            );

            vein.setAttribute(
              'color',
              '#00ff66'
            );

            catheter.setAttribute(
              'visible',
              'true'
            );

            needle.setAttribute(
              'visible',
              'true'
            );

            scoreText.setAttribute(
              'value',
              'SCORE: ' + score
            );
          });


          /* STEP 4 */

          catheter.addEventListener('click', () => {

            if (currentStep !== 4) return;

            currentStep = 5;
            score += 40;

            instructions.setAttribute(
              'value',
              'SUCCESS! VENOUS ACCESS ACHIEVED'
            );

            catheter.setAttribute(
              'color',
              '#00ff66'
            );

            needle.setAttribute(
              'color',
              '#00ff66'
            );

            bloodTube.setAttribute(
              'visible',
              'true'
            );

            blood.setAttribute(
              'visible',
              'true'
            );

            success.setAttribute(
              'visible',
              'true'
            );

            scoreText.setAttribute(
              'value',
              'FINAL SCORE: ' + score + '/100'
            );
          });

        };

        if (this.el.hasLoaded) {
          setup();
        } else {
          this.el.addEventListener('loaded', setup);
        }

      }

    });
  </script>
</head>


<body>

<a-scene
  cannulation-logic
  background="color: #dcecf2"
>

  <!-- LIGHTING -->

  <a-light
    type="ambient"
    intensity="1.6"
    color="#ffffff">
  </a-light>

  <a-light
    type="directional"
    intensity="1.3"
    position="-3 5 4"
    color="#ffffff">
  </a-light>


  <!-- ENVIRONMENT -->

  <a-sky color="#dcecf2"></a-sky>

  <a-plane
    position="0 0 -3"
    rotation="-90 0 0"
    width="12"
    height="12"
    color="#d5dfe3">
  </a-plane>


  <!-- MEDICAL TRAY -->

  <a-box
    position="0 0.82 -2.2"
    width="3.8"
    height="0.18"
    depth="1.8"
    color="#f8fafb">
  </a-box>

  <a-box
    position="0 0.70 -2.2"
    width="3.8"
    height="0.08"
    depth="1.8"
    color="#9aa7ad">
  </a-box>

  <a-box
    position="-1.55 0.35 -2.85"
    width="0.12"
    height="0.7"
    depth="0.12"
    color="#647278">
  </a-box>

  <a-box
    position="1.55 0.35 -2.85"
    width="0.12"
    height="0.7"
    depth="0.12"
    color="#647278">
  </a-box>


  <!-- ARM -->

  <a-cylinder
    position="0 1.05 -2.2"
    radius="0.23"
    height="1.65"
    rotation="0 0 90"
    color="#d39a7b">
  </a-cylinder>

  <a-cylinder
    position="-0.78 1.05 -2.2"
    radius="0.29"
    height="0.65"
    rotation="0 0 90"
    color="#d39a7b">
  </a-cylinder>

  <a-sphere
    position="-0.42 1.05 -2.2"
    radius="0.27"
    color="#d39a7b">
  </a-sphere>

  <!-- HAND -->

  <a-box
    position="1.02 1.05 -2.2"
    width="0.55"
    height="0.25"
    depth="0.45"
    color="#d39a7b">
  </a-box>


  <!-- BLUE TOURNIQUET -->

  <a-torus
    id="tourniquet"
    class="clickable"
    position="-0.30 1.05 -2.2"
    radius="0.27"
    radius-tubular="0.045"
    rotation="0 90 0"
    color="#005eff">
  </a-torus>


  <!-- VEIN -->

  <a-cylinder
    id="vein"
    class="clickable"
    position="0.10 1.28 -2.02"
    radius="0.045"
    height="0.55"
    rotation="0 0 90"
    color="#329bd3"
    visible="false">
  </a-cylinder>


  <!-- GREEN ALCOHOL SWAB -->

  <a-box
    id="swab"
    class="clickable"
    position="1.15 1.08 -1.45"
    width="0.28"
    height="0.08"
    depth="0.12"
    color="#00dd55">
  </a-box>


  <!-- CANNULA -->

  <a-cylinder
    id="catheter"
    class="clickable"
    position="0.10 1.31 -1.72"
    radius="0.045"
    height="0.42"
    rotation="90 0 0"
    color="#ffd000"
    visible="false">
  </a-cylinder>


  <!-- CANNULA HUB -->

  <a-cylinder
    position="0.10 1.31 -1.48"
    radius="0.09"
    height="0.13"
    rotation="90 0 0"
    color="#eeb400">
  </a-cylinder>


  <!-- NEEDLE -->

  <a-cylinder
    id="needle"
    position="0.10 1.31 -1.93"
    radius="0.012"
    height="0.55"
    rotation="90 0 0"
    color="#c5cdd1"
    visible="false">
  </a-cylinder>


  <!-- SHARP NEEDLE TIP -->

  <a-cone
    position="0.10 1.31 -2.21"
    radius-bottom="0.025"
    radius-top="0"
    height="0.12"
    rotation="90 0 0"
    color="#aeb7bb"
    visible="false">
  </a-cone>


  <!-- SYRINGE -->

  <a-cylinder
    position="1.0 1.18 -1.75"
    radius="0.09"
    height="0.55"
    rotation="0 0 90"
    color="#edf5f7">
  </a-cylinder>

  <!-- SYRINGE PLUNGER -->

  <a-cylinder
    position="1.32 1.18 -1.75"
    radius="0.075"
    height="0.22"
    rotation="0 0 90"
    color="#aebbc0">
  </a-cylinder>

  <!-- SYRINGE NEEDLE -->

  <a-cylinder
    position="0.38 1.18 -1.75"
    radius="0.012"
    height="0.40"
    rotation="0 0 90"
    color="#b8c0c4">
  </a-cylinder>


  <!-- SMALL TRAY FOR BLOOD TUBE -->

  <a-box
    position="1.0 0.94 -1.45"
    width="1.1"
    height="0.07"
    depth="0.75"
    color="#aebbc0">
  </a-box>

  <a-box
    position="1.0 0.98 -1.45"
    width="0.95"
    height="0.025"
    depth="0.60"
    color="#e7edef">
  </a-box>


  <!-- BLOOD COLLECTION TUBE -->

  <a-cylinder
    id="blood-tube"
    position="1.35 1.18 -1.45"
    radius="0.065"
    height="0.45"
    color="#f5f7f8"
    visible="false">
  </a-cylinder>


  <!-- RED CAP -->

  <a-cylinder
    position="1.35 1.42 -1.45"
    radius="0.075"
    height="0.07"
    color="#c92727"
    visible="false">
  </a-cylinder>


  <!-- BLOOD -->

  <a-cylinder
    id="blood"
    position="1.35 1.02 -1.45"
    radius="0.055"
    height="0.18"
    color="#9e1717"
    visible="false">
  </a-cylinder>


  <!-- CAMERA / HEAD-UP DISPLAY -->

  <a-camera position="0 1.6 0">

    <!-- TITLE -->

    <a-text
      value="TMS-XR | IV CANNULATION"
      position="-1.30 0.78 -1.5"
      width="2.7"
      color="#123047"
      align="center">
    </a-text>


    <!-- INSTRUCTIONS -->

    <a-text
      id="step-text"
      value="STEP 1 | LOOK AT THE GREEN SWAB"
      position="0 0.52 -1.5"
      width="3.0"
      color="#16252d"
      align="center">
    </a-text>


    <!-- SCORE -->

    <a-text
      id="score-text"
      value="SCORE: 0"
      position="1.05 0.78 -1.5"
      width="1.0"
      color="#123047"
      align="center">
    </a-text>


    <!-- GAZE CURSOR -->

    <a-cursor
      fuse="true"
      fuse-timeout="1500"
      color="#ff3333"
      geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.025"
      raycaster="objects: .clickable">
    </a-cursor>

  </a-camera>


  <!-- SUCCESS MESSAGE - NO RECTANGULAR PANEL -->

  <a-text
    id="success"
    value="PROCEDURE COMPLETE"
    position="-1.25 1.75 -2.7"
    width="2.5"
    color="#087f5b"
    align="center"
    visible="false">
  </a-text>


</a-scene>

</body>
</html>
