<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TMS-XR | IV Cannulation Simulator</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <script>
    let currentStep = 1;
    let score = 0;

    AFRAME.registerComponent('cannulation-logic', {

      init: function () {

        const scene = this.el;

        const setup = () => {

          const instructions = document.querySelector('#step-text');
          const scoreText = document.querySelector('#score-text');

          const swab = document.querySelector('#swab');
          const tourniquet = document.querySelector('#tourniquet');
          const vein = document.querySelector('#vein');
          const catheter = document.querySelector('#catheter');

          const successPanel = document.querySelector('#success-panel');

          // STEP 1
          swab.addEventListener('click', () => {

            if (currentStep !== 1) return;

            currentStep = 2;
            score += 20;

            instructions.setAttribute(
              'value',
              'STEP 2  •  Apply the BLUE tourniquet'
            );

            swab.setAttribute('color', '#777777');

            scoreText.setAttribute(
              'value',
              'SCORE  ' + score
            );
          });

          // STEP 2
          tourniquet.addEventListener('click', () => {

            if (currentStep !== 2) return;

            currentStep = 3;
            score += 20;

            instructions.setAttribute(
              'value',
              'STEP 3  •  Identify the highlighted VEIN'
            );

            vein.setAttribute('visible', 'true');

            tourniquet.setAttribute('color', '#777777');

            scoreText.setAttribute(
              'value',
              'SCORE  ' + score
            );
          });

          // STEP 3
          vein.addEventListener('click', () => {

            if (currentStep !== 3) return;

            currentStep = 4;
            score += 20;

            instructions.setAttribute(
              'value',
              'STEP 4  •  Insert the YELLOW CANNULA'
            );

            vein.setAttribute('color', '#00ff66');

            catheter.setAttribute('visible', 'true');

            scoreText.setAttribute(
              'value',
              'SCORE  ' + score
            );
          });

          // STEP 4
          catheter.addEventListener('click', () => {

            if (currentStep !== 4) return;

            currentStep = 5;
            score += 40;

            instructions.setAttribute(
              'value',
              'SUCCESS  •  Cannulation completed!'
            );

            catheter.setAttribute('color', '#00ff66');

            scoreText.setAttribute(
              'value',
              'FINAL SCORE  ' + score + '/100'
            );

            successPanel.setAttribute('visible', 'true');
          });

        };

        if (scene.hasLoaded) {
          setup();
        } else {
          scene.addEventListener('loaded', setup);
        }

      }

    });
  </script>
</head>

<body>

<a-scene
  cannulation-logic
  background="color: #e8f1f5">

  <!-- ========================= -->
  <!-- LIGHTING -->
  <!-- ========================= -->

  <a-light
    type="ambient"
    color="#ffffff"
    intensity="1.4">
  </a-light>

  <a-light
    type="directional"
    position="-2 5 4"
    color="#ffffff"
    intensity="1.2">
  </a-light>

  <!-- ========================= -->
  <!-- ROOM -->
  <!-- ========================= -->

  <a-sky color="#dcecf2"></a-sky>

  <!-- FLOOR -->

  <a-plane
    position="0 0 -2"
    rotation="-90 0 0"
    width="12"
    height="12"
    color="#d7e0e5">
  </a-plane>

  <!-- BACK WALL -->

  <a-plane
    position="0 3 -4"
    width="12"
    height="6"
    color="#edf4f7">
  </a-plane>


  <!-- ========================= -->
  <!-- TOP TITLE PANEL -->
  <!-- ========================= -->

  <a-plane
    position="0 2.75 -3"
    width="5.8"
    height="0.65"
    color="#123047">
  </a-plane>

  <a-text
    value="TMS-XR"
    position="-2.65 2.88 -3.02"
    width="1.5"
    color="#ffffff">
  </a-text>

  <a-text
    value="MOBILE CLINICAL SKILLS SIMULATOR"
    position="-1.0 2.88 -3.02"
    width="3.8"
    color="#8fd3ff">
  </a-text>


  <!-- ========================= -->
  <!-- INSTRUCTION PANEL -->
  <!-- ========================= -->

  <a-plane
    position="0 2.25 -3"
    width="5.8"
    height="0.55"
    color="#ffffff"
    opacity="0.95">
  </a-plane>

  <a-text
    id="step-text"
    value="STEP 1  •  Look at the GREEN swab"
    position="-2.55 2.28 -3.03"
    width="4.9"
    color="#17232b">
  </a-text>


  <!-- ========================= -->
  <!-- SCORE PANEL -->
  <!-- ========================= -->

  <a-plane
    position="2.25 1.95 -3"
    width="1.35"
    height="0.42"
    color="#123047">
  </a-plane>

  <a-text
    id="score-text"
    value="SCORE  0"
    position="1.75 1.96 -3.03"
    width="1.6"
    color="#ffffff">
  </a-text>


  <!-- ========================= -->
  <!-- PROCEDURE TABLE -->
  <!-- ========================= -->

  <a-box
    position="0 0.82 -2"
    width="3.6"
    height="0.16"
    depth="1.8"
    color="#f8fafb">
  </a-box>

  <!-- TABLE EDGE -->

  <a-box
    position="0 0.72 -2"
    width="3.6"
    height="0.08"
    depth="1.8"
    color="#b8c4ca">
  </a-box>

  <!-- TABLE LEGS -->

  <a-box
    position="-1.45 0.35 -2.65"
    width="0.12"
    height="0.75"
    depth="0.12"
    color="#6f7c82">
  </a-box>

  <a-box
    position="1.45 0.35 -2.65"
    width="0.12"
    height="0.75"
    depth="0.12"
    color="#6f7c82">
  </a-box>

  <a-box
    position="-1.45 0.35 -1.35"
    width="0.12"
    height="0.75"
    depth="0.12"
    color="#6f7c82">
  </a-box>

  <a-box
    position="1.45 0.35 -1.35"
    width="0.12"
    height="0.75"
    depth="0.12"
    color="#6f7c82">
  </a-box>


  <!-- ========================= -->
  <!-- PATIENT ARM -->
  <!-- ========================= -->

  <!-- Main forearm -->

  <a-cylinder
    position="0 1.03 -2"
    radius="0.23"
    height="1.55"
    rotation="0 0 90"
    color="#d59a7b">
  </a-cylinder>

  <!-- Upper arm -->

  <a-cylinder
    position="-0.72 1.03 -2"
    radius="0.29"
    height="0.65"
    rotation="0 0 90"
    color="#d59a7b">
  </a-cylinder>

  <!-- Elbow -->

  <a-sphere
    position="-0.38 1.03 -2"
    radius="0.27"
    color="#d59a7b">
  </a-sphere>


  <!-- ========================= -->
  <!-- HAND -->
  <!-- ========================= -->

  <a-box
    position="0.92 1.05 -2"
    width="0.55"
    height="0.22"
    depth="0.42"
    color="#d59a7b"
    rotation="0 0 5">
  </a-box>

  <!-- fingers -->

  <a-cylinder
    position="1.18 1.12 -2.12"
    radius="0.055"
    height="0.42"
    rotation="0 0 90"
    color="#d59a7b">
  </a-cylinder>

  <a-cylinder
    position="1.18 1.12 -2.02"
    radius="0.055"
    height="0.42"
    rotation="0 0 90"
    color="#d59a7b">
  </a-cylinder>

  <a-cylinder
    position="1.18 1.12 -1.92"
    radius="0.055"
    height="0.42"
    rotation="0 0 90"
    color="#d59a7b">
  </a-cylinder>


  <!-- ========================= -->
  <!-- BLUE TOURNIQUET -->
  <!-- ========================= -->

  <a-torus
    id="tourniquet"
    class="clickable"
    position="-0.3 1.03 -2"
    radius="0.27"
    radius-tubular="0.035"
    rotation="0 90 0"
    color="#0066ff">
  </a-torus>


  <!-- ========================= -->
  <!-- VEIN -->
  <!-- ========================= -->

  <a-cylinder
    id="vein"
    class="clickable"
    position="0.15 1.27 -1.82"
    radius="0.045"
    height="0.48"
    rotation="0 0 90"
    color="#2996d6"
    visible="false">
  </a-cylinder>


  <!-- ========================= -->
  <!-- IV CANNULA -->
  <!-- ========================= -->

  <a-cylinder
    id="catheter"
    class="clickable"
    position="0.15 1.28 -1.58"
    radius="0.045"
    height="0.38"
    rotation="90 0 0"
    color="#ffcc00"
    visible="false">
  </a-cylinder>


  <!-- Cannula hub -->

  <a-sphere
    position="0.15 1.28 -1.39"
    radius="0.08"
    color="#f0b400"
    visible="false">
  </a-sphere>


  <!-- ========================= -->
  <!-- MEDICAL TRAY -->
  <!-- ========================= -->

  <a-box
    position="1.05 0.94 -1.35"
    width="0.9"
    height="0.08"
    depth="0.65"
    color="#b9c3c8">
  </a-box>

  <a-box
    position="1.05 0.99 -1.35"
    width="0.78"
    height="0.03"
    depth="0.53"
    color="#e9eef0">
  </a-box>


  <!-- ========================= -->
  <!-- GREEN SWAB -->
  <!-- ========================= -->

  <a-box
    id="swab"
    class="clickable"
    position="0.95 1.08 -1.35"
    width="0.25"
    height="0.07"
    depth="0.12"
    color="#00dd55">
  </a-box>


  <!-- ========================= -->
  <!-- SMALL MEDICAL ITEMS -->
  <!-- ========================= -->

  <a-cylinder
    position="1.28 1.08 -1.5"
    radius="0.08"
    height="0.14"
    color="#ffffff">
  </a-cylinder>

  <a-cylinder
    position="0.75 1.08 -1.5"
    radius="0.06"
    height="0.13"
    color="#e8f2f5">
  </a-cylinder>


  <!-- ========================= -->
  <!-- SUCCESS PANEL -->
  <!-- ========================= -->

  <a-plane
    id="success-panel"
    position="0 1.75 -2.95"
    width="3.8"
    height="0.7"
    color="#0c7c59"
    visible="false">
  </a-plane>

  <a-text
    value="✓  PROCEDURE COMPLETE"
    position="-1.35 1.83 -3"
    width="3"
    color="#ffffff"
    visible="false"
    id="success-text">
  </a-text>


  <!-- ========================= -->
  <!-- CAMERA -->
  <!-- ========================= -->

  <a-camera position="0 1.6 0">

    <a-cursor
      fuse="true"
      fuse-timeout="1500"
      color="#ff3333"
      raycaster="objects: .clickable">
    </a-cursor>

  </a-camera>

</a-scene>

</body>
</html>
